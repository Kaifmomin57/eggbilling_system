services:
  - type: web
    name: egg-billing-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DOCS
        value: "false"
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard (Supabase URL)
      - key: SECRET_KEY
        sync: false          # Set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel frontend URL
    healthCheckPath: /
